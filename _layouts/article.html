<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    {{ page.title }} | {{ site.title }}
  </title>

  <meta
    name="description"
    content="{{ page.description }}"
  >

  <link
    rel="canonical"
    href="{{ site.url }}{{ page.url }}"
  >

  <style>

    body{
      margin:0;
      background:#f6f8fc;
      color:#172033;
      font:16px/1.75 system-ui,-apple-system,
      "Segoe UI",Roboto,Arial,sans-serif;
    }

    .wrap{
      width:min(1080px,calc(100% - 34px));
      margin:auto;
    }

    .top{
      background:#fff;
      border-bottom:1px solid #e3e8f0;
      padding:18px 0;
    }

    .brand{
      font-weight:850;
      color:#1262e8;
      text-decoration:none;
    }

    .article{
      padding:45px 0 80px;
    }

    .content{
      background:#fff;
      border:1px solid #e3e8f0;
      border-radius:18px;
      padding:clamp(22px,5vw,55px);
    }

    a{
      color:#1262e8;
    }

    img{
      max-width:100%;
      height:auto;
    }

    table{
      max-width:100%;
      border-collapse:collapse;
    }

    th,
    td{
      padding:10px;
      border:1px solid #ddd;
      text-align:left;
    }

  </style>

</head>


<body>

<header class="top">

  <div class="wrap">

    <a
      class="brand"
      href="{{ '/' | relative_url }}"
    >
      SpaceHub Global
    </a>

  </div>

</header>


<main class="article">

  <div class="wrap">

    <article class="content">

      {{ content }}

    </article>

  </div>

</main>


</body>

</html>
